<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="icon" type="image/x-icon" href="../../assets/images/Logo-Juanita.ico">

    <title>Iniciar sesión | Juanita Lencería</title>
</head>


<body>

    <main class="min-h-screen flex items-center justify-center px-4">

        <section class="juanita-auth-card w-full max-w-md">

            <div class="text-center mb-8">

                <a href="../../index.html">
                    <img src="../../assets/images/Logo-Juanita.ico" alt="Juanita Lencería"
                        class="w-24 h-24 object-contain mx-auto mb-4">
                </a>


                <h1 class="juanita-auth-title">
                    Iniciar sesión
                </h1>

            </div>


            <form id="loginForm">

                <div class="mb-4">

                    <label for="email" class="block mb-2 font-semibold">
                        Correo electrónico
                    </label>

                    <input type="email" id="email" name="email" required class="juanita-input w-full"
                        placeholder="ejemplo@correo.com">

                </div>


                <div class="mb-6">

                    <label for="password" class="block mb-2 font-semibold">
                        Contraseña
                    </label>

                    <input type="password" id="password" name="password" required class="juanita-input w-full"
                        placeholder="Ingrese su contraseña">

                </div>


                <button type="submit" id="loginBtn" class="juanita-button w-full">
                    Iniciar sesión
                </button>

            </form>


            <p class="text-center mt-6">

                ¿No tienes una cuenta?

                <a href="../registro/registro.html" class="juanita-auth-link">
                    Crear cuenta
                </a>

            </p>

        </section>

    </main>


    <script type="module" src="./login.js"></script>

</body>

</html>
