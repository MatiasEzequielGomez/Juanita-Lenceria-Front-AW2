<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Crear cuenta | Juanita Lencería</title>
</head>

<body class="bg-gray-50">

    <main class="min-h-screen flex items-center justify-center px-4 py-8">

        <section class="w-full max-w-md border rounded-lg shadow-sm p-8 bg-white">

            <div class="text-center mb-8">
                <img
                    src="../../assets/images/Logo-Juanita.ico"
                    alt="Juanita Lencería"
                    class="w-24 h-24 object-contain mx-auto mb-4"
                >

                <h1 class="text-2xl font-bold">
                    Crear cuenta
                </h1>
            </div>

            <form id="registroForm">

                <div class="mb-4">
                    <label for="nombre" class="block mb-2 font-medium">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        required
                        class="w-full border rounded-lg px-4 py-2"
                    >
                </div>

                <div class="mb-4">
                    <label for="apellido" class="block mb-2 font-medium">
                        Apellido
                    </label>

                    <input
                        type="text"
                        id="apellido"
                        required
                        class="w-full border rounded-lg px-4 py-2"
                    >
                </div>

                <div class="mb-4">
                    <label for="email" class="block mb-2 font-medium">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        required
                        class="w-full border rounded-lg px-4 py-2"
                    >
                </div>

                <div class="mb-4">
                    <label for="telefono" class="block mb-2 font-medium">
                        Teléfono
                    </label>

                    <input
                        type="text"
                        id="telefono"
                        required
                        class="w-full border rounded-lg px-4 py-2"
                    >
                </div>

                <div class="mb-6">
                    <label for="password" class="block mb-2 font-medium">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        required
                        class="w-full border rounded-lg px-4 py-2"
                    >
                </div>

                <button
                    type="submit"
                    class="w-full border rounded-lg px-4 py-2 font-semibold hover:bg-gray-100"
                >
                    Crear cuenta
                </button>

            </form>

            <p class="text-center mt-6">
                ¿Ya tienes una cuenta?

                <a
                    href="../login/login.html"
                    class="font-semibold underline"
                >
                    Iniciar sesión
                </a>
            </p>

        </section>

    </main>

    <script type="module" src="./registro.js"></script>
</body>

</html>
